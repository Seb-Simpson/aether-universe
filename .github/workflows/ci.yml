name: Verify AETHER
on:
  push:
    branches: [main, codex/aether-001-foundation, codex/aether-001b-pages]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Responsive and pointer regressions
        run: |
          npm run start > /tmp/aether-server.log 2>&1 &
          AETHER_SERVER_PID=$!
          trap 'kill "$AETHER_SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/aether-universe/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/responsive-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            docs/screenshots/
            docs/qa-metrics.json
            playwright-report/
            test-results/
          retention-days: 14
